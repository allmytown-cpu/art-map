name: 진단 (임시)

# GitHub 러너에서 apis.data.go.kr 에 도달 가능한지 확인하기 위한 일회성 워크플로.
# 원인 파악 후 삭제할 것.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: DNS 조회
        run: |
          echo "── getent ──"; getent ahosts apis.data.go.kr || true
          echo "── dig A ──";  dig +short A apis.data.go.kr || true
          echo "── dig AAAA ──"; dig +short AAAA apis.data.go.kr || true

      - name: TCP / TLS 연결
        run: |
          echo "── nc 443 ──"
          timeout 15 bash -c 'cat < /dev/null > /dev/tcp/apis.data.go.kr/443' && echo "TCP OK" || echo "TCP FAIL"
          echo "── openssl s_client ──"
          timeout 20 openssl s_client -connect apis.data.go.kr:443 -servername apis.data.go.kr </dev/null 2>&1 | head -25 || true

      - name: curl (IPv4 강제)
        continue-on-error: true
        env:
          KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          ENC=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['KEY'],safe=''))")
          URL="https://apis.data.go.kr/B553457/cultureinfo/period2?serviceKey=$ENC&from=20260913&to=20301231&PageNo=1&sortStdr=1"
          echo "── curl -4 ──"
          curl -4 -sS -v --max-time 40 -o /tmp/out4.xml -w '\nHTTP=%{http_code} time=%{time_total}s\n' "$URL" 2>&1 | tail -30
          echo "── 응답 앞부분 ──"; head -c 400 /tmp/out4.xml || true

      - name: curl (IPv6 강제)
        continue-on-error: true
        env:
          KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          ENC=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['KEY'],safe=''))")
          URL="https://apis.data.go.kr/B553457/cultureinfo/period2?serviceKey=$ENC&from=20260913&to=20301231&PageNo=1&sortStdr=1"
          curl -6 -sS --max-time 40 -o /tmp/out6.xml -w 'HTTP=%{http_code} time=%{time_total}s\n' "$URL" || echo "IPv6 실패"
          head -c 200 /tmp/out6.xml || true

      - name: Node fetch (기본 / IPv4 고정)
        continue-on-error: true
        env:
          KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          cat > /tmp/t.mjs <<'EOF'
          import dns from 'node:dns';
          const url = 'https://apis.data.go.kr/B553457/cultureinfo/period2?serviceKey='
            + encodeURIComponent(process.env.KEY)
            + '&from=20260913&to=20301231&PageNo=1&sortStdr=1';
          async function tryIt(label) {
            const t0 = Date.now();
            try {
              const r = await fetch(url, { signal: AbortSignal.timeout(40000) });
              const t = await r.text();
              console.log(`${label}: HTTP ${r.status} ${Date.now() - t0}ms len=${t.length}`);
              console.log('   ', t.slice(0, 160).replace(/\n/g, ' '));
            } catch (e) {
              console.log(`${label}: 실패 ${Date.now() - t0}ms`);
              console.log('    message:', e.message);
              console.log('    cause  :', e.cause && (e.cause.code || e.cause.message));
            }
          }
          await tryIt('기본');
          dns.setDefaultResultOrder('ipv4first');
          await tryIt('ipv4first');
          EOF
          node --version
          node /tmp/t.mjs
