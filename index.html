<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>ART MAP · 내 주변 전시·공연 지도</title>
<meta name="description" content="공공데이터 기반 전국 전시·공연·문화행사 지도. 내 위치에서 가까운 순으로 찾아보세요." />
<meta name="theme-color" content="#111418" />
<meta property="og:title" content="ART MAP · 내 주변 전시·공연 지도" />
<meta property="og:description" content="지금 내 주변에서 열리는 전시와 공연을 지도에서 찾아보세요." />
<meta property="og:type" content="website" />

<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/icon.svg" />
<!-- ?v= 는 캐시 무효화용. 정적 자원을 고치면 이 숫자를 올릴 것. -->
<link rel="stylesheet" href="assets/style.css?v=3" />

<script>
  // ── 서비스 워커 강제 해제 (디버깅 기간 한정) ───────────────
  // v1 서비스 워커가 CSS/JS를 캐시 우선으로 돌려주는 바람에 수정이
  // 사용자에게 반영되지 않았다. 지도 문제가 해결될 때까지 PWA 캐시를
  // 비활성화하고, 기존에 설치된 워커와 캐시를 모두 지운다.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      var had = rs.length > 0;
      rs.forEach(function (r) { r.unregister(); });
      if (window.caches && caches.keys) {
        caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
      }
      // 워커가 있었다면 그 워커가 응답한 낡은 자원을 쓰고 있으므로 한 번 새로고침
      if (had && !sessionStorage.getItem('swCleared')) {
        sessionStorage.setItem('swCleared', '1');
        location.reload();
      }
    });
  }
</script>

<script>
  // 네이버 지도 인증 실패 콜백. maps.js 로드 전에 정의되어야 한다.
  // 인증 실패는 지도 생성 후 비동기로 발생하므로, 부팅 오버레이가 이미 사라진
  // 뒤일 수 있다. 따라서 오버레이와 무관한 별도 배너로 띄운다.
  // 진단용: 페이지에서 발생한 스크립트 오류를 모아둔다.
  window.__jsErrors = [];
  window.addEventListener('error', function (e) {
    var m = e.message || (e.target && e.target.src ? '리소스 로드 실패: ' + e.target.src : '알 수 없음');
    if (window.__jsErrors.length < 10) window.__jsErrors.push(String(m).slice(0, 160));
  }, true);

  window.__mapAuthFailed = false;
  window.navermap_authFailure = function () {
    window.__mapAuthFailed = true;
    var b = document.getElementById('mapError');
    if (!b) return;
    b.innerHTML =
      '<strong>네이버 지도 인증 실패</strong>' +
      '<span>NCP 콘솔 → Maps → Application → <b>art-map</b> 의 ' +
      '<b>Web 서비스 URL</b>에 <code>' + location.origin + '</code> 을 등록해야 합니다.</span>' +
      '<span class="dim">Key ID: ior0d6uleb · 반영까지 몇 분 걸릴 수 있습니다.</span>';
    b.hidden = false;
  };
</script>
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=ior0d6uleb"></script>
<script src="https://cdn.jsdelivr.net/gh/navermaps/marker-tools.js@master/marker-clustering/src/MarkerClustering.js"></script>
</head>

<body>
  <div id="map" aria-label="지도"></div>

  <!-- 지도 로드 실패 배너 (부팅 오버레이와 독립) -->
  <div id="mapError" class="map-error" hidden></div>

  <!-- 상단: 검색 + 분야 필터 ------------------------------------- -->
  <header class="topbar">
    <div class="searchrow">
      <span class="brand" aria-hidden="true">🎨</span>
      <input id="search" type="search" placeholder="전시·공연·장소 검색" autocomplete="off" aria-label="검색" />
      <button id="btnClearSearch" class="icon-btn" type="button" aria-label="검색어 지우기" hidden>✕</button>
    </div>
    <div id="chips" class="chips" role="group" aria-label="분야 필터"></div>
  </header>

  <!-- 우측 플로팅 버튼 ------------------------------------------- -->
  <div class="fabs">
    <button id="btnLocate" class="fab" type="button" aria-label="내 위치로 이동">📍</button>
    <button id="btnRefresh" class="fab fab-sm" type="button" aria-label="이 지역 다시 검색">🔄</button>
  </div>

  <!-- 하단 시트: 가까운 순 목록 ---------------------------------- -->
  <section id="sheet" class="sheet" aria-label="행사 목록">
    <button id="sheetHandle" class="sheet-handle" type="button" aria-expanded="false">
      <span class="grip"></span>
      <span id="sheetTitle" class="sheet-title">불러오는 중…</span>
    </button>
    <div id="sheetBody" class="sheet-body">
      <ul id="list" class="list"></ul>
      <div id="listEmpty" class="empty" hidden>조건에 맞는 행사가 없습니다.</div>
      <button id="btnMore" class="more" type="button" hidden>더 보기</button>
      <p class="credit">
        출처 · 공공데이터포털
        <a href="https://www.data.go.kr/data/15138937/openapi.do" target="_blank" rel="noopener">한눈에보는문화정보</a>
        <span id="updatedAt"></span>
      </p>
    </div>
  </section>

  <!-- 상세 패널 --------------------------------------------------- -->
  <div id="detail" class="detail" hidden>
    <button id="detailClose" class="detail-close" type="button" aria-label="닫기">✕</button>
    <div id="detailBody"></div>
  </div>
  <div id="scrim" class="scrim" hidden></div>

  <!-- 부팅/오류 메시지 -------------------------------------------- -->
  <div id="boot" class="boot">
    <div class="spinner" aria-hidden="true"></div>
    <p id="bootMessage">문화행사 정보를 불러오는 중…</p>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="assets/app.js?v=3"></script>
</body>
</html>
